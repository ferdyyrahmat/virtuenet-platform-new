services:
  # Production PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-app-prod
    restart: always
    working_dir: /var/www/html
    environment:
      - RUN_APP_SETUP=true
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - silva-prod-network

  # Production Nginx Server
  web:
    image: nginx:alpine
    container_name: silva-web-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - silva-prod-network

  # Production MySQL Database
  db:
    image: mysql:8.0
    container_name: silva-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-silva_kit_prod}
      MYSQL_USER: ${DB_USERNAME:-silva_prod_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-silva_prod_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prod_root_secret}
    volumes:
      - silva-prod-dbdata:/var/lib/mysql
    networks:
      - silva-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Production Redis Cache & Queue Engine
  redis:
    image: redis:7-alpine
    container_name: silva-redis-prod
    restart: always
    volumes:
      - silva-prod-redisdata:/data
    networks:
      - silva-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Laravel Horizon queue supervisor
  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-horizon-prod
    restart: always
    working_dir: /var/www/html
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - silva-prod-network

  # Laravel scheduler for Horizon metrics
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-scheduler-prod
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - silva-prod-network

  # Laravel Pulse server metrics collector
  pulse-check:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: silva-pulse-check-prod
    restart: always
    working_dir: /var/www/html
    command: php artisan pulse:check
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit_prod}
      - DB_USERNAME=${DB_USERNAME:-silva_prod_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - silva-prod-network

networks:
  silva-prod-network:
    driver: bridge

volumes:
  silva-prod-dbdata:
    driver: local
  silva-prod-redisdata:
    driver: local
