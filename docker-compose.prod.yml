services:
  # Production Octane / FrankenPHP application
  app:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    working_dir: /app
    environment:
      - RUN_APP_SETUP=true
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - virtuenet-prod-network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health/live') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Production Nginx Server
  web:
    init: true
    image: nginx:alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - virtuenet-prod-network

  # Production PostgreSQL Database
  db:
    image: postgres:16-alpine
    init: true
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-virtuenet}
      POSTGRES_USER: ${DB_USERNAME:-virtuenet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - virtuenet-prod-dbdata:/var/lib/postgresql/data
    networks:
      - virtuenet-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 10s
      retries: 5

  # Production Redis Cache & Queue Engine
  redis:
    init: true
    image: redis:7-alpine
    restart: always
    volumes:
      - virtuenet-prod-redisdata:/data
    networks:
      - virtuenet-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Laravel Horizon queue supervisor
  horizon:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    working_dir: /app
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - virtuenet-prod-network

  # Laravel scheduler for Horizon metrics
  scheduler:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    working_dir: /app
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - virtuenet-prod-network

  # Laravel Pulse server metrics collector
  pulse-check:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    restart: always
    working_dir: /app
    command: php artisan pulse:check
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - virtuenet-prod-network

networks:
  virtuenet-prod-network:
    driver: bridge

volumes:
  virtuenet-prod-dbdata:
    driver: local
  virtuenet-prod-redisdata:
    driver: local
