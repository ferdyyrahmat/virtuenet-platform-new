name: Laravel CI

on:
  push:
    branches:
      - codex/virtuenet-alignment
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run AI gateway regression tests
        run: php artisan test tests/Feature/AiGatewaySmokeCheckTest.php tests/Feature/AiCredentialLifecycleTest.php tests/Feature/LiteLlmGatewayTest.php tests/Feature/PlatformWorkflowTest.php

      - name: Run full test suite
        run: php artisan test
