name: Laravel CI

on:
  push:
    branches:
      - codex/virtuenet-alignment
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run AI gateway regression tests
        run: php artisan test tests/Feature/AiGatewaySmokeCheckTest.php tests/Feature/AiCredentialLifecycleTest.php tests/Feature/LiteLlmGatewayTest.php tests/Feature/PlatformWorkflowTest.php

      - name: Run full test suite
        run: php artisan test

  container-rehearsal:
    name: Docker deployment rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker Desktop-compatible environment
        run: cp .env.docker.example .env

      - name: Validate local Compose contract
        run: docker compose config --quiet

      - name: Validate production Compose contract
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build immutable production image
        run: docker compose build app

      - name: Boot production-like stack
        run: docker compose up -d --no-build

      - name: Wait for Laravel health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs app
          exit 1

      - name: Verify readiness and runtime services
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/readiness
          docker compose exec -T app php artisan horizon:status
          running="$(docker compose ps --services --filter status=running)"
          for service in app db redis horizon scheduler pulse-check; do
            grep -qx "$service" <<<"$running" || {
              echo "$service is not running"
              docker compose ps
              exit 1
            }
          done

      - name: Capture container evidence
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=150 app horizon scheduler pulse-check || true

      - name: Tear down rehearsal stack
        if: always()
        run: docker compose down -v --remove-orphans
