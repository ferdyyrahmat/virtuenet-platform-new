services:
  # Laravel PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: silva-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit}
      - DB_USERNAME=${DB_USERNAME:-silva_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - silva-network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: silva-web-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "5173:5173" # Vite HMR port
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - silva-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: silva-db-dev
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-silva_kit}
      MYSQL_USER: ${DB_USERNAME:-silva_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-silva_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - silva-dbdata:/var/lib/mysql
    networks:
      - silva-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Redis Cache & Queue Engine
  redis:
    image: redis:7-alpine
    container_name: silva-redis-dev
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - silva-redisdata:/data
    networks:
      - silva-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Laravel Horizon queue supervisor
  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: silva-horizon-dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit}
      - DB_USERNAME=${DB_USERNAME:-silva_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - silva-network

  # Laravel scheduler for Horizon metrics
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: silva-scheduler-dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit}
      - DB_USERNAME=${DB_USERNAME:-silva_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - silva-network

  # Laravel Pulse server metrics collector
  pulse-check:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: silva-pulse-check-dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan pulse:check
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-silva_kit}
      - DB_USERNAME=${DB_USERNAME:-silva_user}
      - DB_PASSWORD=${DB_PASSWORD:-silva_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - app
      - db
      - redis
    networks:
      - silva-network

networks:
  silva-network:
    driver: bridge

volumes:
  silva-dbdata:
    driver: local
  silva-redisdata:
    driver: local
