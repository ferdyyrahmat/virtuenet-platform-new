x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile.prod

x-runtime-environment: &runtime-environment
  APP_NAME: ${APP_NAME:-VirtueNet Platform}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?APP_KEY is required - copy .env.docker.example to .env}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  OCTANE_SERVER: frankenphp
  OCTANE_HTTPS: ${OCTANE_HTTPS:-false}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-virtuenet}
  DB_USERNAME: ${DB_USERNAME:-virtuenet}
  DB_PASSWORD: ${DB_PASSWORD:-virtuenet_local_only}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  CACHE_STORE: ${CACHE_STORE:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  PULSE_ENABLED: ${PULSE_ENABLED:-true}
  PULSE_PATH: ${PULSE_PATH:-pulse}
  PULSE_STORAGE_DRIVER: ${PULSE_STORAGE_DRIVER:-database}
  PULSE_INGEST_DRIVER: ${PULSE_INGEST_DRIVER:-storage}
  PULSE_SERVER_NAME: ${PULSE_SERVER_NAME:-app}
  LARK_APPROVAL_ENABLED: ${LARK_APPROVAL_ENABLED:-false}
  LARK_APPROVAL_OUTBOUND_ENABLED: ${LARK_APPROVAL_OUTBOUND_ENABLED:-false}

x-app-runtime: &app-runtime
  init: true
  build: *app-build
  image: ${APP_IMAGE:-virtuenet-platform:local}
  restart: unless-stopped
  working_dir: /app
  env_file:
    - .env
  environment: *runtime-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - virtuenet-network

services:
  # Docker Desktop reaches Laravel directly; no Nginx hop.
  app:
    <<: *app-runtime
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      <<: *runtime-environment
      RUN_APP_SETUP: "true"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health/live') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  db:
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-virtuenet}
      POSTGRES_USER: ${DB_USERNAME:-virtuenet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-virtuenet_local_only}
    volumes:
      - virtuenet-dbdata:/var/lib/postgresql/data
    networks:
      - virtuenet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - virtuenet-redisdata:/data
    networks:
      - virtuenet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  horizon:
    <<: *app-runtime
    command: php artisan horizon
    environment:
      <<: *runtime-environment
      RUN_APP_SETUP: "false"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-runtime
    command: php artisan schedule:work
    environment:
      <<: *runtime-environment
      RUN_APP_SETUP: "false"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  pulse-check:
    <<: *app-runtime
    command: php artisan pulse:check
    environment:
      <<: *runtime-environment
      RUN_APP_SETUP: "false"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  virtuenet-network:
    driver: bridge

volumes:
  virtuenet-dbdata:
    driver: local
  virtuenet-redisdata:
    driver: local
