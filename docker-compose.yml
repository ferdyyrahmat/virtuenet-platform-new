services:
  # Laravel PHP-FPM Application
  app:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - RUN_APP_SETUP=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:-virtuenet_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - virtuenet-network

  # Nginx Web Server
  web:
    init: true
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "5173:5173" # Vite HMR port
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
    networks:
      - virtuenet-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-virtuenet}
      POSTGRES_USER: ${DB_USERNAME:-virtuenet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-virtuenet_dev}
    volumes:
      - virtuenet-dbdata:/var/lib/postgresql/data
    networks:
      - virtuenet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 10s
      retries: 5

  # Redis Cache & Queue Engine
  redis:
    init: true
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - virtuenet-redisdata:/data
    networks:
      - virtuenet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Laravel Horizon queue supervisor
  horizon:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:-virtuenet_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - virtuenet-network

  # Laravel scheduler for Horizon metrics
  scheduler:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:-virtuenet_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - virtuenet-network

  # Laravel Pulse server metrics collector
  pulse-check:
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan pulse:check
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-virtuenet}
      - DB_USERNAME=${DB_USERNAME:-virtuenet}
      - DB_PASSWORD=${DB_PASSWORD:-virtuenet_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - virtuenet-network

networks:
  virtuenet-network:
    driver: bridge

volumes:
  virtuenet-dbdata:
    driver: local
  virtuenet-redisdata:
    driver: local
